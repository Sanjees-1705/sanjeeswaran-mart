<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sanjeeswaran-Mart Buyer</title>

    <link rel="stylesheet" href="buyer.css">

</head>


<body>


    <header class="top-header">

        <h1>🛒 Sanjeeswaran-Mart</h1>


        <nav>

            <button onclick="showProducts()">
                Products
            </button>


            <button onclick="showCart()">
                🛒 Cart
            </button>


            <button onclick="showWishlist()">
                ❤️ Wishlist
            </button>


            <button onclick="showOrders()">
                📦 My Orders
            </button>


            <button onclick="logout()">
                Logout
            </button>

        </nav>

    </header>


    <main>


        <section class="welcome-section">

            <h2>
                Welcome, Buyer!
            </h2>

            <p>
                Browse products and start shopping.
            </p>

        </section>


        <section id="productsSection">

            <h2>
                Products
            </h2>


            <div class="product-container">

                <!--
                    Products will be loaded
                    from database using buyer.js
                -->

            </div>

        </section>


    </main>


    <script src="buyer.js"></script>


</body>

</html>
