<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Placed - Sanjeeswaran-Mart</title>

    <link
        rel="stylesheet"
        href="order-success.css"
    >

</head>

<body>

    <main>

        <section class="success-container">

            <div class="success-icon">
                ✅
            </div>

            <h1>
                Order Placed Successfully!
            </h1>

            <p>
                Thank you for shopping with
                Sanjeeswaran-Mart.
            </p>

            <p id="orderId"></p>

            <p id="orderTotal"></p>

            <button
                onclick="continueShopping()"
            >
                🛒 Continue Shopping
            </button>

        </section>

    </main>


    <script src="order-success.js"></script>

</body>

</html>
