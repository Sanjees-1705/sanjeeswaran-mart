<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product - Sanjeeswaran-Mart</title>

    <link rel="stylesheet" href="edit-product.css">

</head>

<body>

    <header class="top-header">

        <h1>🛒 Sanjeeswaran-Mart</h1>

        <p>Seller - Edit Product</p>

    </header>


    <main>

        <section class="edit-product-container">

            <h2>Edit Product</h2>

            <p class="form-subtitle">
                Update your product details
            </p>


            <form id="editProductForm">


                <div class="form-group">

                    <label for="productName">
                        1. Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="productPrice">
                        2. Product Price
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="Enter price in ₹"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="productDescription">
                        3. Product Description
                    </label>

                    <textarea
                        id="productDescription"
                        placeholder="Enter product description"
                        rows="5"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="productStock">
                        4. Stock Quantity
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        placeholder="Enter available quantity"
                        min="0"
                        required
                    >

                </div>


                <div class="current-image-section">

                    <label>
                        Current Product Image
                    </label>

                    <img
                        id="currentImage"
                        src=""
                        alt="Current Product Image"
                    >

                </div>


                <div class="form-group">

                    <label for="productImage">
                        5. New Product Image
                    </label>

                    <input
                        type="file"
                        id="productImage"
                        accept="image/*"
                    >

                    <small>
                        Leave empty if you don't want to change the image.
                    </small>

                </div>


                <p id="productMessage"></p>


                <button
                    type="submit"
                    class="update-button"
                >
                    ✏️ Update Product
                </button>


                <button
                    type="button"
                    class="back-button"
                    onclick="goBack()"
                >
                    ← Back
                </button>


            </form>

        </section>

    </main>


    <script src="edit-product.js"></script>

</body>

</html>
